name: Dedeník /new

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  check:
    name: Check theme, preview plugins and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PHP and JavaScript syntax
        run: |
          find wp-content/themes/dedenik wp-content/mu-plugins -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -n -l
          find wp-content/themes/dedenik/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Test deployment boundaries and recovery
        run: python3 -B -m unittest discover -s .github/deploy -p 'test_*.py' -v

  deploy:
    name: Deploy to /new
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: dedenik-new-deployment
      cancel-in-progress: false
    environment:
      name: dedenik-new
      url: https://dedenik.cz/new/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare changes with the hosting copy, then deploy over FTPS
        env:
          FTPS_HOST: ${{ secrets.SVETDEDE_FTP_HOST }}
          FTPS_USER: ${{ secrets.SVETDEDE_FTP_USER }}
          FTPS_PASSWORD: ${{ secrets.SVETDEDE_FTP_PASSWORD }}
          FTPS_PORT: ${{ vars.SVETDEDE_FTP_PORT || '21' }}
        run: |
          python3 -B .github/deploy/new_site.py --dry-run
          python3 -B .github/deploy/new_site.py --apply
      - name: Verify the public preview over HTTPS
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            "https://dedenik.cz/new/?deploy=${GITHUB_SHA}" -o "$RUNNER_TEMP/dedenik-home.html"
          grep -Fq '/new/wp-content/themes/dedenik/' "$RUNNER_TEMP/dedenik-home.html"

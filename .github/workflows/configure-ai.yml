name: Configure staging AI search
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svetdede-theme
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: svetdede
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure server key and verify live search
        env:
          SVETDEDE_FTP_HOST: ${{ secrets.SVETDEDE_FTP_HOST }}
          SVETDEDE_FTP_USER: ${{ secrets.SVETDEDE_FTP_USER }}
          SVETDEDE_FTP_PASSWORD: ${{ secrets.SVETDEDE_FTP_PASSWORD }}
          SVETDEDE_FTP_PORT: ${{ vars.SVETDEDE_FTP_PORT || '21' }}
          SVETDEDE_GEMINI_API_KEY: ${{ secrets.SVETDEDE_GEMINI_API_KEY }}
        run: python3 scripts/configure-ai.py

name: Sync staging uploads (November local inventory)
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Copy only missing media into staging uploads
permissions:
  contents: read
concurrency:
  group: svetdede-theme
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: svetdede
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory and optionally copy missing uploads
        env:
          SVETDEDE_FTP_HOST: ${{ secrets.SVETDEDE_FTP_HOST }}
          SVETDEDE_FTP_USER: ${{ secrets.SVETDEDE_FTP_USER }}
          SVETDEDE_FTP_PASSWORD: ${{ secrets.SVETDEDE_FTP_PASSWORD }}
          SVETDEDE_FTP_PORT: ${{ vars.SVETDEDE_FTP_PORT || '21' }}
          UPLOAD_APPLY: ${{ inputs.apply && 'true' || 'false' }}
        run: python3 scripts/sync-staging-uploads.py
      - name: Save compressed media inventory in log
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('scripts/uploads-report.json')
          if p.exists():
              encoded=base64.b64encode(gzip.compress(p.read_bytes())).decode('ascii')
              for start in range(0,len(encoded),16000):
                  print('MEDIA_REPORT_CHUNK='+encoded[start:start+16000])
          PY
